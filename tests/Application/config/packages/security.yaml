# The URLs of a theme start with "%app.path_prefix%": "" for bootstrap, "/shadcn" for shadcn (see App\Kernel).
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'plaintext'
    providers:
        users_in_memory:
            memory:
                users:
                    admin: { password: 'admin', roles: ['ROLE_ADMIN'] }
    firewalls:
        dev:
            pattern: ^%app.path_prefix%/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: users_in_memory
            form_login:
                login_path: sylius_admin_ui_login
                check_path: sylius_admin_ui_login_check
                default_target_path: sylius_admin_ui_dashboard
                enable_csrf: true
                csrf_parameter: _csrf_admin_security_token
                csrf_token_id: admin_authenticate
            logout:
                path: sylius_admin_ui_logout
                target: sylius_admin_ui_login
    access_control:
        - { path: '^%app.path_prefix%/admin/login', roles: PUBLIC_ACCESS }
        - { path: '^%app.path_prefix%/admin/logout', roles: PUBLIC_ACCESS }
        - { path: '^%app.path_prefix%/admin', roles: ROLE_ADMIN }
